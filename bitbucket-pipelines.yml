# Bitbucket Pipelines for nrp-backend (EBR2-35).
#
# Builds the in-repo Dockerfile and pushes to Docker Hub at
# hbpneurorobotics/nrp-backend.
#
# IMPORTANT — BASE_IMAGE
# ----------------------
# The backend Dockerfile takes a BASE_IMAGE build-arg whose default
# (docker-registry.ebrains.eu/nrp/nrp-core/nrp-vanilla-ubuntu20:dev4.0)
# points at an EBRAINS registry that may be intermittently
# unavailable while nrp-core revival is in progress. To pin a
# different base for Phase 1 baseline builds, set repository
# variable NRP_BASE_IMAGE; the pipeline forwards it as a build-arg.
# Leave NRP_BASE_IMAGE empty (or unset) to use the Dockerfile default.
#
# Repository variables required (Pipelines → Repository variables,
# mark Secured for the token):
#   DOCKERHUB_USER      — must be `hbpneurorobotics`.
#   DOCKERHUB_TOKEN     — Docker Hub PAT.
#   NRP_BASE_IMAGE      — optional override of the Dockerfile BASE_IMAGE.
#
# Tag policy on push:
#   push to development     → :development AND :revival-baseline
#                              AND :sha-<short>
#   tag push <name>         → :<name> AND :sha-<short>
#   manual custom build     → :revival-baseline-manual AND :sha-<short>

image: atlassian/default-image:4

definitions:
  services:
    docker:
      memory: 4096
  steps:
    - step: &build-and-push
        name: Build and push nrp-backend image
        services:
          - docker
        caches:
          - docker
        size: 2x
        script:
          - export IMAGE=hbpneurorobotics/nrp-backend
          - export SHORT_SHA="${BITBUCKET_COMMIT:0:12}"
          - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USER" --password-stdin
          - |
            BUILD_ARGS=""
            if [ -n "$NRP_BASE_IMAGE" ]; then
              BUILD_ARGS="--build-arg BASE_IMAGE=$NRP_BASE_IMAGE"
              echo "Building with BASE_IMAGE=$NRP_BASE_IMAGE"
            else
              echo "Building with the Dockerfile-default BASE_IMAGE"
            fi
          - docker build $BUILD_ARGS -t "$IMAGE:sha-$SHORT_SHA" .
          - |
            if [ -n "$BITBUCKET_TAG" ]; then
              docker tag "$IMAGE:sha-$SHORT_SHA" "$IMAGE:$BITBUCKET_TAG"
              EXTRA_TAGS="$IMAGE:$BITBUCKET_TAG"
            elif [ "$BITBUCKET_BRANCH" = "development" ]; then
              docker tag "$IMAGE:sha-$SHORT_SHA" "$IMAGE:development"
              docker tag "$IMAGE:sha-$SHORT_SHA" "$IMAGE:revival-baseline"
              EXTRA_TAGS="$IMAGE:development $IMAGE:revival-baseline"
            else
              docker tag "$IMAGE:sha-$SHORT_SHA" "$IMAGE:revival-baseline-manual"
              EXTRA_TAGS="$IMAGE:revival-baseline-manual"
            fi
          - docker push "$IMAGE:sha-$SHORT_SHA"
          - for t in $EXTRA_TAGS; do docker push "$t"; done
          - docker logout

pipelines:
  branches:
    development:
      - step: *build-and-push
  tags:
    "*":
      - step: *build-and-push
  custom:
    build-baseline:
      - step: *build-and-push
